<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Вход — Vibeo</title>
<link rel="icon" type="image/png" href="/assets/aistudio/Frame_109_723ce2c6.png" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--ink:#f4f1ea;--mid:#8d8b86;--line:rgba(244,241,234,.14)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh}
header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:20px 28px;background:rgba(10,10,11,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:20}
.logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:600;letter-spacing:.09em;color:var(--ink);text-decoration:none}
.logo img{width:22px;height:22px;border-radius:3px}
.back{font:500 11.5px 'IBM Plex Mono',monospace;color:var(--mid);text-decoration:none;padding:8px 14px;border:1px solid var(--line);border-radius:99px}
.container{max-width:480px;margin:50px auto 80px;padding:0 20px}
.card{border:1px solid var(--line);background:rgba(244,241,234,.02);padding:38px 30px;border-radius:8px}
.tag{font:500 11.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--mid);margin-bottom:12px}
h1{font-size:clamp(26px,6vw,34px);letter-spacing:-.035em;font-weight:500;margin-bottom:8px}
.sub{font-size:14px;line-height:1.5;color:var(--mid);margin-bottom:26px}
label{display:block;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.05em;margin-bottom:6px}
input{width:100%;height:48px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:6px;padding:0 14px;color:var(--ink);font:16px 'Inter Tight',sans-serif;outline:none;margin-bottom:16px}
input:focus{border-color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;background:var(--ink);color:var(--bg);border:none;border-radius:99px;font:600 13.5px 'Inter Tight',sans-serif;letter-spacing:.04em;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px}
.hint{margin-top:18px;font-size:12.5px;line-height:1.5;color:var(--mid);text-align:center}
.spin{width:14px;height:14px;border:2px solid var(--mid);border-top-color:var(--ink);border-radius:50%;animation:s 1s linear infinite;display:inline-block;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.who{font:500 12px 'IBM Plex Mono',monospace;color:var(--mid);margin-bottom:18px}
@media(max-width:760px){header{padding:16px 18px}.container{margin-top:24px}.card{padding:28px 20px}}
</style>
</head>
<body>
<header>
  <a href="/" class="logo"><img src="/assets/aistudio/Frame_109_723ce2c6.png" alt="" />VIBEO</a>
  <a href="/" class="back">← НА ГЛАВНУЮ</a>
</header>
<main class="container"><div class="card">

  <div id="s1" hidden>
    <div class="tag">ВХОД ЧЕРЕЗ TELEGRAM</div>
    <h1>Войдите в Vibeo</h1>
    <p class="sub">Без паролей и почты: нажмите кнопку, откройте бота и нажмите «Запустить». Вход произойдёт сам.</p>
    <button class="btn" id="login">ВОЙТИ ЧЕРЕЗ TELEGRAM &nbsp;→</button>
    <a class="btn ghost" id="reopen" hidden>ОТКРЫТЬ БОТА В TELEGRAM</a>
    <p class="hint" id="st"></p>
  </div>

  <div id="s2" hidden>
    <div class="tag">КОМНАТА</div>
    <h1>Создайте комнату</h1>
    <div class="who" id="who"></div>
    <label for="rn">НАЗВАНИЕ</label>
    <input id="rn" maxlength="60" placeholder="Киновечер пятницы" />
    <button class="btn" id="mk">СОЗДАТЬ КОМНАТУ &nbsp;→</button>
    <a class="btn ghost" id="next" hidden>ВЕРНУТЬСЯ В КОМНАТУ</a>
  </div>

</div></main>
<script>
const $=s=>document.querySelector(s);
const api=async(u,o)=>{try{const r=await fetch(u,o);return await r.json()}catch{return null}};
const nextUrl=(()=>{const n=new URLSearchParams(location.search).get('next');return n&&/^\/room\/[\w-]+$/.test(n)?n:''})();
const mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
let iv=null;
async function boot(){
  $('#s1').hidden=false;
  const m=await api('/api/me');
  if(!m){$('#login').disabled=true;$('#st').textContent='Сервер Vibeo не отвечает. Попробуйте позже.';return}
  if(m.user){show2(m.user);return}
  const saved=JSON.parse(localStorage.getItem('vauth')||'null');
  if(saved&&Date.now()-saved.t<9e5)waitLogin(saved.token,saved.url); // вернулись из Telegram — продолжаем ждать
}
function show2(u){
  $('#s1').hidden=true;$('#s2').hidden=false;
  $('#who').textContent='@ '+u.name+(u.plus?'  ·  PLUS':'');
  if(nextUrl){$('#next').hidden=false;$('#next').href=nextUrl}
}
function waitLogin(token,url){
  $('#login').disabled=true;
  $('#reopen').href=url;$('#reopen').hidden=false;
  $('#st').innerHTML='<span class="spin"></span>Ждём подтверждения в Telegram…';
  clearInterval(iv);
  const check=async()=>{
    const p=(await api('/api/auth/poll?token='+token))||{};
    if(p.status==='ok'){
      clearInterval(iv);localStorage.removeItem('vauth');
      if(nextUrl){location.href=nextUrl;return}
      const m=await api('/api/me');if(m&&m.user)show2(m.user);
    }
    if(p.status==='expired'){clearInterval(iv);localStorage.removeItem('vauth');$('#login').disabled=false;$('#reopen').hidden=true;$('#st').textContent='Ссылка устарела — нажмите «Войти» ещё раз.'}
  };
  iv=setInterval(check,1500);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
}
$('#login').onclick=async()=>{
  const btn=$('#login');btn.disabled=true;
  const d=await api('/api/auth/start',{method:'POST'});
  if(!d||!d.token){btn.disabled=false;$('#st').textContent='Бот пока не настроен (проверьте TELEGRAM_BOT_TOKEN).';return}
  localStorage.setItem('vauth',JSON.stringify({token:d.token,url:d.url,t:Date.now()}));
  waitLogin(d.token,d.url);
  if(mobile){
    // на телефоне попапы блокируются — открываем приложение Telegram напрямую; кнопка «Открыть бота» остаётся запасной
    const bot=new URL(d.url).pathname.slice(1);
    location.href='tg://resolve?domain='+bot+'&start='+d.token;
  }else{
    if(!window.open(d.url,'_blank'))$('#st').innerHTML+='<br>Нажмите «Открыть бота снова».';
  }
};
$('#mk').onclick=async()=>{
  const d=await api('/api/rooms',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('#rn').value})});
  if(d&&d.id)location.href='/room/'+d.id;else alert('Не удалось создать комнату');
};
boot();
</script>
</body>
</html>
